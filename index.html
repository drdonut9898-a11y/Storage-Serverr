<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite Store - Cloud Message Saver</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #fff; padding: 40px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 500px; background: #1e293b; padding: 25px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        h2, h3 { text-align: center; color: #38bdf8; }
        textarea, button { width: 100%; padding: 12px; margin-top: 10px; border-radius: 6px; border: none; box-sizing: border-box; font-size: 14px; }
        textarea { background: #334155; color: #fff; height: 100px; resize: none; outline: none; }
        textarea:focus { border: 1px solid #38bdf8; }
        button { background: #3b82f6; color: white; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background: #2563eb; }
        .msg-list { margin-top: 20px; background: #0f172a; padding: 15px; border-radius: 6px; max-height: 250px; overflow-y: auto; }
        .msg-item { background: #334155; padding: 10px; margin-bottom: 8px; border-radius: 5px; word-break: break-all; font-size: 14px; }
        .empty { color: #94a3b8; text-align: center; font-style: italic; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🌐 Elite Store - Cloud Notes</h2>
        <textarea id="msgInput" placeholder="Apna message yahan likh..."></textarea>
        <button onclick="saveMessage()">Save to Cloud</button>
        
        <h3>Saved Messages</h3>
        <div class="msg-list" id="msgList">
            <p class="empty">Loading...</p>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Tera Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyCV_GOx143Z4OjrbnLenzgAK8qwxfeYQ3Q",
            authDomain: "expose-firemc.firebaseapp.com",
            projectId: "expose-firemc",
            storageBucket: "expose-firemc.firebasestorage.app",
            messagingSenderId: "1065994074091",
            appId: "1:1065994074091:web:86105bdf3d6feeb36b0bae",
            measurementId: "G-JMMTJ03R2N"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.saveMessage = async function() {
            const input = document.getElementById('msgInput');
            const text = input.value.trim();
            if (!text) return;

            try {
                await addDoc(collection(db, "messages"), {
                    text: text,
                    timestamp: new Date()
                });
                input.value = '';
                loadMessages();
            } catch (e) {
                alert("Error saving message: " + e);
            }
        }

        async function loadMessages() {
            const listDiv = document.getElementById('msgList');
            
            try {
                const q = query(collection(db, "messages"), orderBy("timestamp", "desc"));
                const querySnapshot = await getDocs(q);
                
                if (querySnapshot.empty) {
                    linkDivText = '<p class="empty">No messages saved yet.</p>';
                    listDiv.innerHTML = '<p class="empty">No messages saved yet.</p>';
                    return;
                }

                listDiv.innerHTML = '';
                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    listDiv.innerHTML += `<div class="msg-item">${data.text}</div>`;
                });
            } catch (e) {
                listDiv.innerHTML = `<p class="empty">Error loading messages.</p>`;
            }
        }

        loadMessages();
    </script>
</body>
</html>
