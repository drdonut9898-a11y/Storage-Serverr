<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite Store - Glowing Cloud Chat</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        body { 
            background: url('background.jpeg') no-repeat center center fixed; 
            background-size: cover; 
            color: #f8fafc; 
            height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            position: relative;
        }

        /* Dark Translucent Overlay for Glassmorphism readability */
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 14, 23, 0.75);
            backdrop-filter: blur(8px);
            z-index: -1;
        }
        
        .chat-container { 
            width: 100%; 
            max-width: 680px; 
            height: 92vh; 
            background: rgba(30, 41, 59, 0.65); 
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 16px; 
            display: flex; 
            flex-direction: column; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.6), 0 0 20px rgba(249, 115, 22, 0.2); 
            overflow: hidden; 
            border: 1px solid rgba(255, 255, 255, 0.15); 
            animation: scaleIn 0.4s cubic-bezier(0.16, 1, 0.3, 1); 
        }
        
        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        
        /* Chat Header */
        .chat-header { padding: 18px 22px; background: rgba(15, 23, 42, 0.85); border-bottom: 1px solid rgba(255, 255, 255, 0.1); display: flex; flex-direction: column; gap: 12px; }
        .header-top { display: flex; justify-content: space-between; align-items: center; }
        .chat-title { font-size: 19px; font-weight: bold; color: #fb923c; display: flex; align-items: center; gap: 8px; text-shadow: 0 0 10px rgba(251, 146, 60, 0.4); }
        .chat-stats { font-size: 12px; color: #38bdf8; background: rgba(56, 189, 248, 0.15); padding: 4px 10px; border-radius: 20px; border: 1px solid rgba(56, 189, 248, 0.3); }
        
        /* Search Bar */
        .search-input { width: 100%; padding: 10px 14px; background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 8px; color: #fff; font-size: 13px; outline: none; transition: 0.3s; }
        .search-input:focus { border-color: #fb923c; box-shadow: 0 0 8px rgba(251, 146, 60, 0.4); }

        /* Message History Area */
        .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; background: rgba(11, 15, 25, 0.4); scroll-behavior: smooth; }
        
        /* Message Bubble */
        .message-bubble { background: rgba(30, 41, 59, 0.75); padding: 14px 16px; border-radius: 10px; max-width: 85%; word-break: break-all; position: relative; border-left: 4px solid #fb923c; box-shadow: 0 4px 10px rgba(0,0,0,0.3); animation: fadeInUp 0.3s ease; border-top: 1px solid rgba(255,255,255,0.05); }
        
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .msg-text { font-size: 14px; white-space: pre-wrap; line-height: 1.5; color: #f1f5f9; }
        .msg-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; font-size: 10px; color: #94a3b8; }
        
        .msg-actions { display: flex; gap: 6px; opacity: 0.7; transition: 0.2s; }
        .message-bubble:hover .msg-actions { opacity: 1; }
        
        .action-btn { background: rgba(51, 65, 85, 0.8); border: none; color: #cbd5e1; cursor: pointer; font-size: 11px; padding: 4px 8px; border-radius: 6px; transition: 0.2s; }
        .action-btn:hover { color: #fff; background: rgba(71, 85, 105, 1); transform: translateY(-1px); }
        .edit-btn:hover { background: #38bdf8; color: #000; }
        .delete-btn:hover { background: #ef4444; color: #fff; }

        /* Bottom Input Bar */
        .chat-input-area { padding: 15px 20px; background: rgba(15, 23, 42, 0.85); border-top: 1px solid rgba(255, 255, 255, 0.1); display: flex; gap: 10px; align-items: center; }
        .chat-input { flex: 1; padding: 12px; background: rgba(30, 41, 59, 0.8); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 10px; color: #fff; font-size: 14px; resize: none; height: 48px; max-height: 120px; outline: none; transition: 0.3s; }
        .chat-input:focus { border-color: #fb923c; box-shadow: 0 0 10px rgba(251, 146, 60, 0.4); }
        
        .send-btn { background: linear-gradient(135deg, #f97316, #3b82f6); border: none; color: white; padding: 0 22px; height: 48px; border-radius: 10px; font-weight: bold; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 15px rgba(249, 115, 22, 0.4); }
        .send-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(56, 189, 248, 0.5); }
        .send-btn:active { transform: translateY(0); }

        .empty-chat { text-align: center; color: #94a3b8; font-style: italic; margin-top: 50px; }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">
            <div class="header-top">
                <div class="chat-title">✨ Elite Store - Glowing Cloud</div>
                <div class="chat-stats" id="totalStats">Loading...</div>
            </div>
            <input type="text" class="search-input" id="searchInput" placeholder="🔍 Search old or similar messages..." oninput="filterMessages()">
        </div>

        <div class="chat-messages" id="msgList">
            <div class="empty-chat">Loading messages...</div>
        </div>

        <div class="chat-input-area">
            <textarea class="chat-input" id="msgInput" placeholder="Type a message... (Press Enter to send)" rows="1" onkeydown="checkEnter(event)"></textarea>
            <button class="send-btn" id="actionBtn" onclick="handleSubmit()">Send 🚀</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCV_GOx143Z4OjrbnLenzgAK8qwxfeYQ3Q",
            authDomain: "expose-firemc.firebaseapp.com",
            projectId: "expose-firemc",
            storageBucket: "expose-firemc.firebasestorage.app",
            messagingSenderId: "1065994074091",
            appId: "1:1065994074091:web:86105bdf3d6feeb36b0bae",
            measurementId: "G-JMMTJ03R2N"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        let allMessages = [];
        let editingId = null;

        window.checkEnter = function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                handleSubmit();
            }
        }

        window.handleSubmit = async function() {
            const input = document.getElementById('msgInput');
            const text = input.value.trim();
            if (!text) return;

            try {
                if (editingId) {
                    await updateDoc(doc(db, "messages", editingId), {
                        text: text
                    });
                    editingId = null;
                    document.getElementById('actionBtn').innerText = "Send 🚀";
                } else {
                    await addDoc(collection(db, "messages"), {
                        text: text,
                        timestamp: new Date().toISOString()
                    });
                }
                input.value = '';
                loadMessages();
            } catch (e) {
                alert("Error: " + e.message);
            }
        }

        window.editMessage = function(id, encodedText) {
            const text = decodeURIComponent(encodedText);
            document.getElementById('msgInput').value = text;
            document.getElementById('msgInput').focus();
            editingId = id;
            document.getElementById('actionBtn').innerText = "Update ✏️";
        }

        window.deleteMessage = async function(id) {
            if (!confirm("Delete this message?")) return;
            try {
                await deleteDoc(doc(db, "messages", id));
                if (editingId === id) {
                    editingId = null;
                    document.getElementById('msgInput').value = '';
                    document.getElementById('actionBtn').innerText = "Send 🚀";
                }
                loadMessages();
            } catch (e) {
                alert("Error deleting: " + e.message);
            }
        }

        window.copyMessage = function(btn) {
            const text = decodeURIComponent(btn.getAttribute('data-text'));
            navigator.clipboard.writeText(text);
            const originalText = btn.innerText;
            btn.innerText = "✅ Copied!";
            setTimeout(() => { btn.innerText = originalText; }, 1500);
        }

        window.filterMessages = function() {
            const queryText = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allMessages.filter(m => m.text.toLowerCase().includes(queryText));
            displayMessages(filtered);
        }

        async function loadMessages() {
            const listDiv = document.getElementById('msgList');
            
            try {
                const querySnapshot = await getDocs(collection(db, "messages"));
                
                allMessages = [];
                querySnapshot.forEach((document) => {
                    allMessages.push({
                        id: document.id,
                        ...document.data()
                    });
                });

                allMessages.sort((a, b) => new Date(a.timestamp || 0) - new Date(b.timestamp || 0));

                document.getElementById('totalStats').innerText = `${allMessages.length} msgs`;
                displayMessages(allMessages);
            } catch (e) {
                listDiv.innerHTML = `<div class="empty-chat">Error loading messages. Check Firebase rules!</div>`;
            }
        }

        function displayMessages(messages) {
            const listDiv = document.getElementById('msgList');
            
            if (messages.length === 0) {
                listDiv.innerHTML = '<div class="empty-chat">No messages found.</div>';
                return;
            }

            listDiv.innerHTML = '';
            messages.forEach((data) => {
                const dateStr = data.timestamp ? new Date(data.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
                const encodedText = encodeURIComponent(data.text);
                
                listDiv.innerHTML += `
                    <div class="message-bubble">
                        <div class="msg-text">${escapeHtml(data.text)}</div>
                        <div class="msg-footer">
                            <span>${dateStr}</span>
                            <div class="msg-actions">
                                <button class="action-btn edit-btn" onclick="editMessage('${data.id}', '${encodedText}')">✏️ Edit</button>
                                <button class="action-btn" data-text="${encodedText}" onclick="copyMessage(this)">📋 Copy</button>
                                <button class="action-btn delete-btn" onclick="deleteMessage('${data.id}')">🗑️ Delete</button>
                            </div>
                        </div>
                    </div>
                `;
            });
            listDiv.scrollTop = listDiv.scrollHeight;
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        loadMessages();
    </script>
</body>
</html>
